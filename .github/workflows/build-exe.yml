name: Build CENTERLINES EXE

on:
  push:
    branches: [exe-build-fix]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -U pyinstaller ezdxf ifcopenshell

      - name: Build EXE
        run: .\build_exe.bat

      - name: Upload CENTERLINES.exe
        uses: actions/upload-artifact@v4
        with:
          name: CENTERLINES-windows
          path: dist/CENTERLINES.exe
          if-no-files-found: error
